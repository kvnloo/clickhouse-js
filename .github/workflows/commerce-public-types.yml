# Fork-only experiment. Do not include this workflow in the upstream patch.
name: Commerce public-type validation
on:
  push:
    branches: [ci/commerce-public-types]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: commerce-public-types-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    if: github.repository == 'kvnloo/clickhouse-js'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: original-pr
            revision: 23be63f3f41c3077aba25a4d10c3a0745bcfcab2
          - mode: candidate
            revision: 1d4a452080bdbdfb2f2797ed46347d22983760d6
    env:
      CI: 'true'
      HUSKY: '0'
      NO_COLOR: '1'
    steps:
      - name: Check out the exact revision without experiment files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kvnloo/clickhouse-js
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_REVISION: ${{ matrix.revision }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - name: Set up the repository's CI Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install the checked-in dependency lock
        run: npm ci
      - name: Build the actual packages
        id: build
        run: npm run build
      - name: Typecheck including the candidate public contract
        id: typecheck
        run: npm run typecheck
      - name: Run existing workspace lint
        id: lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run lint
      - name: Check formatting of all three candidate files
        id: candidate_format
        if: ${{ !cancelled() && matrix.mode == 'candidate' && steps.build.outcome == 'success' }}
        run: node_modules/.bin/prettier --check package.json tests/public-types/exports.ts tests/public-types/tsconfig.json
      - name: Report full repository formatting without suppressing failures
        id: format
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run prettier:check
      - name: Install Node example dependencies used by upstream unit CI
        id: examples
        if: ${{ !cancelled() && matrix.mode == 'candidate' && steps.build.outcome == 'success' }}
        run: npm --prefix examples/node ci
      - name: Run Node unit tests independently of formatting
        id: units
        if: ${{ !cancelled() && matrix.mode == 'candidate' && steps.examples.outcome == 'success' }}
        run: npm run test:node:unit
      - name: Verify no tracked source or lockfile was changed by validation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: git diff --exit-code
      - name: Record separate outcomes
        if: always()
        env:
          MODE: ${{ matrix.mode }}
          REVISION: ${{ matrix.revision }}
          BUILD: ${{ steps.build.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          CANDIDATE_FORMAT: ${{ steps.candidate_format.outcome }}
          FULL_FORMAT: ${{ steps.format.outcome }}
          UNIT_TESTS: ${{ steps.units.outcome }}
        run: |
          printf '### %s\n\nRevision: `%s`\n\n' "$MODE" "$REVISION" >> "$GITHUB_STEP_SUMMARY"
          printf 'Build: %s; typecheck: %s; lint: %s; candidate formatting: %s; full formatting: %s; unit tests: %s\n' "$BUILD" "$TYPECHECK" "$LINT" "$CANDIDATE_FORMAT" "$FULL_FORMAT" "$UNIT_TESTS" | tee -a "$GITHUB_STEP_SUMMARY"
